<div id="viewport">
  <div id="stage">
    <div class="glow" aria-hidden="true"></div>

    <nav id="rail" aria-label="Pages">
      <button class="rail-btn" data-page="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button class="rail-btn" data-page="system" aria-label="System"><svg><use href="#i-cpu"/></svg></button>
      <button class="rail-btn" data-page="media" aria-label="Media"><svg><use href="#i-music"/></svg></button>
      <button class="rail-btn" data-page="focus" aria-label="Focus"><svg><use href="#i-focus"/></svg></button>
      <button class="rail-btn" data-page="world" aria-label="World clock"><svg><use href="#i-globe"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="gameBtn" aria-label="Game mode"><svg><use href="#i-gamepad"/></svg><i class="badge">A</i></button>
      <button class="rail-btn" id="editBtn" aria-label="Customize"><svg><use href="#i-edit"/></svg></button>
      <div class="rail-status" id="railStatus" title="PC link"><span class="dot"></span></div>
      <button class="rail-btn" data-page="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </nav>

    <main id="pages">
      <section class="page" id="page-home"><div class="home-row" id="homeRow"></div></section>
      <section class="page" id="page-system"></section>
      <section class="page" id="page-media"></section>
      <section class="page" id="page-focus"></section>
      <section class="page" id="page-world"></section>
      <section class="page" id="page-settings"></section>
    </main>

    <button id="editDone"><svg><use href="#i-check"/></svg><span>Done</span></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
